name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release gates
        run: npm run check

      - name: Inspect build artifacts
        run: |
          test -f dist/index.html && echo 'index present'
          test -f dist/catalog/index.html && echo 'catalog page present' || true
          test -d dist/_astro && echo 'bundled assets present'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: dist/.playwright
          retention-days: 7